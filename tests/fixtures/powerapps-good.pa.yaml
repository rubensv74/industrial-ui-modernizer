ComponentDefinitions:
  cmp_AP_GoodTree:
    DefinitionType: CanvasComponent
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        DataType: Table
        Default: =Table()
      MaxDepth:
        PropertyKind: Input
        DisplayName: MaxDepth
        DataType: Number
        Default: =3
      SelectedKeyOut:
        PropertyKind: Output
        DisplayName: SelectedKeyOut
        DataType: Text
      OnNodeSelect:
        PropertyKind: Event
        DisplayName: OnNodeSelect
        Description: Emits selected key.
        ReturnType: None
        Default: |+
          =
        Parameters:
          - p_key:
              Description: Key.
              DataType: Text
              Default: =""
    Properties:
      Fill: =Color.Transparent
      Height: =300
      Width: =300
      SelectedKeyOut: =""
    Children:
      - galRows:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =With({p1:LookUp(Items,true),p2:LookUp(Items,true)},Items)
          Children:
            - btnRow:
                Control: Classic/Button@2.2.0
                Properties:
                  Height: =42
                  Width: =120
                  OnSelect: =cmp_AP_GoodTree.OnNodeSelect("A")
